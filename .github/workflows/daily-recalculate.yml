name: Daily Recalculate

on:
  schedule:
    - cron: '0 17 * * *'  # 17:00 UTC = 01:00 WITA
  workflow_dispatch:       # bisa dijalankan manual dari GitHub Actions tab

jobs:
  recalculate:
    runs-on: ubuntu-latest
    steps:
      - name: Set recalculate flag
        run: |
          curl -f -X POST "${{ secrets.APP_URL }}/api/recalculate" \
            -H "x-recalc-secret: ${{ secrets.RECALC_SECRET }}"
