<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#ddd6fe"/>
  <!-- open book -->
  <path d="M200,90 L200,210" stroke="#5b21b6" stroke-width="5"/>
  <!-- left page -->
  <path d="M200,90 C200,90 130,95 120,115 L120,210 C120,210 170,200 200,210 Z" fill="#7c3aed"/>
  <!-- right page -->
  <path d="M200,90 C200,90 270,95 280,115 L280,210 C280,210 230,200 200,210 Z" fill="#8b5cf6"/>
  <!-- lines on left page -->
  <line x1="140" y1="135" x2="190" y2="130" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="140" y1="150" x2="190" y2="145" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="140" y1="165" x2="190" y2="160" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round"/>
  <!-- lines on right page -->
  <line x1="210" y1="130" x2="260" y2="135" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="210" y1="145" x2="260" y2="150" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="210" y1="160" x2="260" y2="165" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round"/>
  <text x="200" y="268" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#3b0764" text-anchor="middle">Pendidikan</text>
</svg>
